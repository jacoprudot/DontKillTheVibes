name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # Full history: the ruleset changelog gate diffs the pushed range
        # (github.event.before / PR base) against the working tree.
        fetch-depth: 0

    - name: Setup Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 12
        run_install: false

    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Setup pnpm cache
      uses: actions/cache@v4
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build MCPs
      run: pnpm build

    - name: Run Unit Tests (80% coverage gate)
      run: pnpm test

    - name: Security audit (no shell, no env leak)
      run: pnpm security:audit

    - name: Validate skills and MCP packages
      run: |
        pnpm validate:skills
        pnpm validate:mcps

    - name: Validate the shipped assessment example
      run: node scripts/validate-assessment.mjs examples/realworld-assessment/assessment.json

    - name: Ruleset changelog gate (undeclared rule changes fail CI)
      shell: bash
      run: |
        REF="${{ github.event.pull_request.base.sha }}"
        if [ -z "$REF" ] || [ "$REF" = "0000000000000000000000000000000000000000" ]; then
          REF="${{ github.event.before }}"
        fi
        if [ -z "$REF" ] || [ "$REF" = "0000000000000000000000000000000000000000" ]; then
          REF="HEAD~1"
        fi
        echo "Diffing the ruleset against $REF"
        node scripts/registry-diff.mjs "$REF"

    - name: MCP security smoke tests (injection guards)
      run: |
        node scripts/mcp-smoke.mjs mcps/git-mcp/dist/index.js get_diff_since '{"since_commit":"HEAD; id"}' --expect INVALID_COMMIT
        node scripts/mcp-smoke.mjs mcps/benchmark-mcp/dist/index.js profile_code '{"binary":"rm","args":["-rf","/"],"profiler":"perf"}' --expect BINARY_NOT_ALLOWED
