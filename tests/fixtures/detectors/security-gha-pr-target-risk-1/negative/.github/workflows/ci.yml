name: PR checks

# Safe variant: untrusted fork code runs under `pull_request`, which has no
# access to repository secrets, so checkout + tests cannot exfiltrate tokens.
on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
