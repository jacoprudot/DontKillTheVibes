name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Publish to registry
        run: npm publish --token "${{ secrets.NPM_TOKEN }}"
      - name: Notify webhook
        run: curl -X POST -d "key=${{ secrets.DEPLOY_WEBHOOK_SECRET }}" https://hooks.example.com/deploy
