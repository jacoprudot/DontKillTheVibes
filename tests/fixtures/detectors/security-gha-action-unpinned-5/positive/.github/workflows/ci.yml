name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lint
        run: pnpm lint
      - name: Build and push image
        uses: docker/build-push-action@master
      - name: Notify
        run: pnpm run notify

